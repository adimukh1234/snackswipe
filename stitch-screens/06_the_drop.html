<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>The Drop - Live Tracking</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#f9f906",
                        "background-light": "#f8f8f5",
                        "background-dark": "#12120a", 
                        "surface-dark": "#1E1E16",
                        "neon-red": "#FF2E63",
                    },
                    fontFamily: {
                        "display": ["Space Grotesk", "sans-serif"],
                        "mono": ["Space Grotesk", "monospace"], // Using Space Grotesk for mono feel as requested by style
                    },
                    borderRadius: { "DEFAULT": "0.5rem", "lg": "1rem", "xl": "1.5rem", "2xl": "2rem", "full": "9999px" },
                    boxShadow: {
                        'neon': '0 0 10px rgba(249, 249, 6, 0.5)',
                        'glow': '0 0 20px rgba(249, 249, 6, 0.3)',
                    }
                },
            },
        }
    </script>
<style>
        /* Custom scrollbar hiding for clean UI */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        
        /* Map texture overlay */
        .map-texture {
            background-image: radial-gradient(circle, #333 1px, transparent 1px);
            background-size: 20px 20px;
            opacity: 0.1;
        }

        /* Pulsing animation for user location */
        @keyframes pulse-ring {
            0% { transform: scale(0.33); }
            80%, 100% { opacity: 0; }
        }
        @keyframes pulse-dot {
            0% { transform: scale(0.8); }
            50% { transform: scale(1); }
            100% { transform: scale(0.8); }
        }
        .ring-container {
            position: relative;
        }
        .circle {
            width: 16px;
            height: 16px;
            background-color: #3B82F6;
            border-radius: 50%;
            position: absolute;
            top: 0;
            left: 0;
        }
        .ringring {
            border: 3px solid #3B82F6;
            border-radius: 30px;
            height: 25px;
            width: 25px;
            position: absolute;
            left: -4.5px;
            top: -4.5px;
            animation: pulse-ring 1.25s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
        }

        /* Route Line Animation Simulation */
        .route-path {
            stroke-dasharray: 10;
            animation: dash 30s linear infinite;
        }
        @keyframes dash {
            to {
                stroke-dashoffset: -1000;
            }
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-dark text-white font-display overflow-hidden h-screen w-full flex flex-col relative">
<!-- Map Container -->
<div class="absolute inset-0 z-0 bg-[#121212]">
<!-- Abstract Dark Map Image -->
<div class="absolute inset-0 bg-cover bg-center opacity-40 mix-blend-luminosity" data-alt="Dark aerial map view of city streets at night" data-location="Neo Tokyo" style="background-image: url('https://placeholder.pics/svg/300');">
</div>
<!-- Map Grid Overlay for Tech Feel -->
<div class="absolute inset-0 map-texture"></div>
<!-- SVG Route Overlay -->
<svg class="absolute inset-0 w-full h-full pointer-events-none z-10">
<!-- Glow Filter -->
<defs>
<filter height="140%" id="glow" width="140%" x="-20%" y="-20%">
<fegaussianblur result="blur" stddeviation="4"></fegaussianblur>
<fecomposite in="SourceGraphic" in2="blur" operator="over"></fecomposite>
</filter>
</defs>
<!-- Route Path -->
<path class="route-path opacity-80" d="M 500 -100 L 450 150 L 200 300 L 220 500" fill="none" filter="url(#glow)" stroke="#f9f906" stroke-opacity="0.6" stroke-width="4"></path>
<!-- Connecting Line to Courier -->
<line stroke="#f9f906" stroke-width="2" x1="200" x2="200" y1="300" y2="300"></line>
</svg>
<!-- User Location Marker (Bottom Center-ish) -->
<div class="absolute top-[60%] left-[55%] transform -translate-x-1/2 -translate-y-1/2 z-20">
<div class="ring-container">
<div class="ringring"></div>
<div class="circle shadow-[0_0_15px_rgba(59,130,246,0.8)]"></div>
</div>
</div>
<!-- Courier Marker (Moving) -->
<div class="absolute top-[35%] left-[30%] transform -translate-x-1/2 -translate-y-1/2 z-30 flex flex-col items-center">
<div class="relative">
<div class="absolute inset-0 bg-primary blur-md rounded-full opacity-40 animate-pulse"></div>
<div class="w-12 h-12 bg-surface-dark border-2 border-primary rounded-full flex items-center justify-center shadow-neon z-10 relative">
<span class="material-symbols-outlined text-primary" style="font-size: 24px;">two_wheeler</span>
</div>
</div>
<div class="mt-2 bg-black/80 backdrop-blur-sm px-3 py-1 rounded-full border border-primary/30">
<p class="text-[10px] font-bold tracking-widest text-primary uppercase">Marco</p>
</div>
</div>
<!-- Restaurant Marker -->
<div class="absolute top-[10%] left-[70%] transform -translate-x-1/2 -translate-y-1/2 z-20">
<div class="w-10 h-10 bg-surface-dark border border-white/20 rounded-full flex items-center justify-center shadow-lg">
<span class="material-symbols-outlined text-white/80" style="font-size: 20px;">restaurant</span>
</div>
</div>
</div>
<!-- UI Overlay Layer -->
<div class="relative z-40 flex flex-col h-full justify-between pointer-events-none">
<!-- Top Bar -->
<div class="flex justify-between items-start p-6 pt-12 pointer-events-auto bg-gradient-to-b from-black/80 to-transparent">
<button class="w-10 h-10 rounded-full bg-surface-dark/60 backdrop-blur-md border border-white/10 flex items-center justify-center text-white hover:bg-surface-dark transition-colors">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<div class="flex gap-3">
<button class="w-10 h-10 rounded-full bg-surface-dark/60 backdrop-blur-md border border-white/10 flex items-center justify-center text-white hover:bg-surface-dark transition-colors">
<span class="material-symbols-outlined">map</span>
</button>
<button class="w-10 h-10 rounded-full bg-surface-dark/60 backdrop-blur-md border border-white/10 flex items-center justify-center text-white hover:bg-surface-dark transition-colors relative">
<span class="material-symbols-outlined">receipt_long</span>
<span class="absolute top-0 right-0 w-3 h-3 bg-primary rounded-full border-2 border-black"></span>
</button>
</div>
</div>
<!-- Bottom Sheet / Status Card -->
<div class="w-full p-4 pointer-events-auto">
<div class="bg-surface-dark/95 backdrop-blur-xl border border-white/10 rounded-3xl p-6 shadow-2xl relative overflow-hidden group">
<!-- Neon Glow Effect inside card -->
<div class="absolute -top-20 -right-20 w-40 h-40 bg-primary/10 rounded-full blur-3xl pointer-events-none"></div>
<!-- Drag Handle -->
<div class="w-12 h-1.5 bg-white/20 rounded-full mx-auto mb-6"></div>
<!-- Status Header & ETA -->
<div class="flex justify-between items-end mb-6">
<div class="flex flex-col">
<p class="text-xs font-mono tracking-widest text-primary mb-1 uppercase">Status</p>
<h2 class="text-2xl font-bold text-white tracking-tight animate-pulse">IN TRANSIT</h2>
<p class="text-sm text-gray-400 mt-1">Order #8823 • 2 items</p>
</div>
<div class="flex flex-col items-end">
<div class="text-5xl font-bold text-primary font-mono tracking-tighter drop-shadow-[0_0_8px_rgba(249,249,6,0.5)]">
                            12<span class="text-2xl ml-1 align-top relative top-1">MIN</span>
</div>
<p class="text-xs text-gray-500 font-mono mt-1 text-right">EST. ARRIVAL 11:42 PM</p>
</div>
</div>
<!-- Segmented Progress Bar -->
<div class="flex gap-1.5 mb-8 h-1.5 w-full">
<div class="flex-1 bg-primary rounded-full shadow-[0_0_8px_rgba(249,249,6,0.6)]"></div>
<div class="flex-1 bg-primary rounded-full shadow-[0_0_8px_rgba(249,249,6,0.6)]"></div>
<div class="flex-1 bg-primary rounded-full shadow-[0_0_8px_rgba(249,249,6,0.6)] animate-pulse"></div>
<div class="flex-1 bg-white/10 rounded-full"></div>
</div>
<!-- Driver & Contact Section -->
<div class="flex items-center justify-between">
<div class="flex items-center gap-4">
<div class="relative">
<div class="w-14 h-14 rounded-full overflow-hidden border-2 border-white/10">
<img alt="Delivery driver portrait looking cool" class="w-full h-full object-cover" data-alt="Close up of a smiling delivery driver" src="https://lh3.googleusercontent.com/aida-public/AB6AXuA_qiv1PhXHiG8IhD6KMU0ep1d4tu_x_fnCaqvz68ORw-1syzep2UHFPYco9wkfipyQuIgkIuKGIJi3Q9enRvwzL96YMKVI0KZmYLXX-_H5AqJtQuskUH64Vyb00rBBUQfKdi8Z-A2_ellXcSUkUfSmidWYcLkzxM3WwbYKkmvi1zIv10GqS8lCU19T9q8EtRX-2_dKl8N4REYcidvV2QHrklPlZNAzibU7VNblB80FNmYDnk-MCqoANcH0q3QEcvDrHcoPeSUpt3qB"/>
</div>
<!-- Rating Badge -->
<div class="absolute -bottom-1 -right-1 bg-black rounded-full px-1.5 py-0.5 border border-white/10 flex items-center gap-0.5">
<span class="material-symbols-outlined text-primary text-[10px]">star</span>
<span class="text-[10px] font-bold text-white">4.9</span>
</div>
</div>
<div>
<h3 class="text-lg font-bold text-white">Marco</h3>
<div class="flex items-center gap-2 text-sm text-gray-400">
<span class="material-symbols-outlined text-sm">electric_moped</span>
<span class="font-mono text-xs uppercase">Black E-Scooter</span>
</div>
</div>
</div>
<!-- Action Buttons -->
<div class="flex gap-3">
<button class="group/btn relative flex items-center justify-center w-12 h-12 rounded-full bg-white/5 border border-white/10 hover:bg-white/10 hover:border-primary/50 transition-all">
<span class="material-symbols-outlined text-white group-hover/btn:text-primary transition-colors">chat_bubble</span>
</button>
<button class="group/btn relative flex items-center justify-center w-12 h-12 rounded-full bg-primary text-black hover:bg-[#d9d905] hover:shadow-neon transition-all">
<span class="material-symbols-outlined font-bold">call</span>
</button>
</div>
</div>
<!-- Expandable details handle (Visual only) -->
<div class="mt-6 pt-4 border-t border-white/5 flex justify-center">
<p class="text-[10px] uppercase tracking-widest text-gray-600 font-mono">Swipe up for details</p>
</div>
</div>
</div>
</div>
</body></html>
